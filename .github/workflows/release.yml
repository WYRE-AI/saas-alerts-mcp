name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline (build →
# semantic-release → Docker → MCP Registry → security). Lives in
# WYRE-AI/.github so every *-mcp repo stays in lockstep.
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@2b0b056bd7544937e5cbd56cf2e1ff8a180a411f
    with:
      server-name: saas-alerts-mcp
      image-name: ghcr.io/wyre-ai/saas-alerts-mcp
    secrets: inherit

  # NOTE: the prod deploy job is intentionally deferred. The canonical pipeline
  # adds a `deploy` job that updates the `gwp-saas-alerts` Azure Container App in
  # `mcp-gateway-prod` by digest. That ACA does not exist until the vendor is
  # provisioned in the gateway/Conduit IaC (vendor-config.ts + vendor-fleet
  # bicep). Re-add the standard `deploy` job below once the vendor is wired into
  # the fleet and a prod rollout is approved:
  #
  #   deploy:
  #     needs: release
  #     if: needs.release.outputs.released == 'true'
  #     permissions:
  #       id-token: write
  #       contents: read
  #     uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-deploy.yml@2b0b056bd7544937e5cbd56cf2e1ff8a180a411f
  #     with:
  #       vendor-slug: saas-alerts
  #       image-name: ghcr.io/wyre-ai/saas-alerts-mcp
  #       digest: ${{ needs.release.outputs.digest }}
  #       version: ${{ needs.release.outputs.version }}
  #     secrets: inherit